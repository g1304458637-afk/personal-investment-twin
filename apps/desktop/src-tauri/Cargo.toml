[package]
name = "toujing-desktop"
version = "0.1.0"
description = "Personal Investment Twin desktop workspace"
authors = ["Personal Investment Twin contributors"]
edition = "2021"
license = "UNLICENSED"

[lib]
name = "toujing_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2.3.5"
tokio = { version = "1", features = ["sync", "time"] }
