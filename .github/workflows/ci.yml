name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-core:
    name: Python core (pytest)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests/ -q

  desktop-frontend:
    name: Desktop frontend (tsc + node tests)
    runs-on: macos-14
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc -b
      - name: Run tests
        run: npm test

  desktop-backend:
    name: Desktop backend (cargo test + clippy)
    runs-on: macos-14
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      # Tauri validates externalBin during cargo checks too. These steps only
      # compile and test the Rust host; packaged-sidecar builds must use the
      # real PyInstaller binary produced by scripts/build_python_sidecar.py.
      - name: Stage placeholder external binary for Rust checks
        run: |
          target="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p binaries
          printf '#!/bin/sh\nexit 1\n' > "binaries/toujing-core-${target}"
          chmod +x "binaries/toujing-core-${target}"
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Tests
        run: cargo test
